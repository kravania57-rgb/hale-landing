document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7c76e0fb-9803-4a84-94eb-8bf53361b400\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  @font-face { font-family: 'Calvino'; src: url(\"75e8b7c8-5825-4581-aa76-f16994e36b20\") format('opentype'); font-weight: 400; font-display: swap; }\n  @font-face { font-family: 'Eastman'; src: url(\"8e79b21a-b018-4515-b9e0-eb114df78c2e\") format('opentype'); font-weight: 400; font-display: swap; }\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #F7F4ED; }\n  a { color: inherit; text-decoration: none; }\n  input, textarea { outline: none; font-family: 'Eastman', sans-serif; }\n  input::placeholder, textarea::placeholder { color: #8a9080; }\n  [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.22,.61,.36,1), transform .8s cubic-bezier(.22,.61,.36,1); }\n  [data-reveal].is-shown { opacity: 1; transform: none; }\n  [data-stagger] { opacity: 0; transition: opacity .6s ease; }\n  [data-stagger].is-shown { opacity: 1; }\n  [data-colorize] { filter: grayscale(1); transition: filter 1.2s ease; }\n  [data-colorize].is-shown { filter: var(--cz, none); }\n  [data-rise] { transform: translateY(18px); transition: transform .55s cubic-bezier(.22,.61,.36,1); }\n  [data-rise].is-shown { transform: none; }\n  @keyframes haleUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }\n  @keyframes haleFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes haleZoom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }\n  @keyframes haleCta { 0%,100% { box-shadow: 0 0 0 0 rgba(192,118,78,.45); } 50% { box-shadow: 0 0 0 10px rgba(192,118,78,0); } }\n  @keyframes haleTab { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Eastman', system-ui, sans-serif; color: #253026; background: #F7F4ED; overflow-x: hidden;\">\n\n  <!-- ===== HEADER ===== -->\n  <header style=\"position: sticky; top: 0; z-index: 50; background: rgba(247,244,237,.82); backdrop-filter: blur(14px); border-bottom: 1px solid #25302614; transition: box-shadow .3s ease, background .3s ease;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 18px clamp(20px, 5vw, 56px); display: flex; align-items: center; justify-content: space-between; transition: padding .3s ease;\">\n      <a href=\"#top\" style=\"font-family: 'Calvino', serif; font-size: 26px;\">Hale<\u002Fa>\n      <sc-if value=\"{{ desktop }}\" hint-placeholder-val=\"{{ true }}\">\n        <nav style=\"display: flex; align-items: center; gap: 26px; font-size: 13.5px; color: #4a5449;\">\n          <a href=\"#about-yulia\" style=\"transition: color .2s;\" style-hover=\"color:#8E9B84\">Про Юлію<\u002Fa>\n          <a href=\"#how\" style=\"transition: color .2s;\" style-hover=\"color:#8E9B84\">Як працюємо<\u002Fa>\n          <a href=\"#reviews\" style=\"transition: color .2s;\" style-hover=\"color:#8E9B84\">Відгуки<\u002Fa>\n          <a href=\"#offer\" style=\"transition: color .2s;\" style-hover=\"color:#8E9B84\">Пропозиції<\u002Fa>\n          <a href=\"#apply\" style=\"background: #253026; color: #F7F4ED; padding: 11px 22px; border-radius: 999px; transition: transform .2s;\" style-hover=\"transform:translateY(-2px)\">Записатись<\u002Fa>\n        <\u002Fnav>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ mobile }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ toggleMenu }}\" style=\"border: none; background: transparent; padding: 8px; display: flex; flex-direction: column; gap: 5px; cursor: pointer;\">\n          <span style=\"width: 24px; height: 2px; background: #253026; display: block;\"><\u002Fspan>\n          <span style=\"width: 24px; height: 2px; background: #253026; display: block;\"><\u002Fspan>\n          <span style=\"width: 24px; height: 2px; background: #253026; display: block;\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav style=\"border-top: 1px solid #25302614; padding: 12px clamp(20px, 5vw, 56px) 22px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; background: #F7F4ED;\">\n        <a href=\"#about-yulia\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"padding: 12px 0; border-bottom: 1px solid #25302610;\">Про Юлію<\u002Fa>\n        <a href=\"#how\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"padding: 12px 0; border-bottom: 1px solid #25302610;\">Як працюємо<\u002Fa>\n        <a href=\"#reviews\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"padding: 12px 0; border-bottom: 1px solid #25302610;\">Відгуки<\u002Fa>\n        <a href=\"#offer\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"padding: 12px 0; border-bottom: 1px solid #25302610;\">Пропозиції<\u002Fa>\n        <a href=\"#apply\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"margin-top: 12px; background: #253026; color: #F7F4ED; padding: 15px 22px; border-radius: 999px; text-align: center;\">Записатись на консультацію<\u002Fa>\n      <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <div id=\"top\"><\u002Fdiv>\n\n  <!-- ===== HERO ===== -->\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 56px) clamp(40px, 6vw, 64px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 26px;\">\n    <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #8E9B84; animation: haleFade .8s both;\">Юлія Кравченко · лікар-натуропат<\u002Fdiv>\n    <h1 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(44px, 8vw, 82px); line-height: 1.0; margin: 0; max-width: 900px; letter-spacing: -.01em; animation: haleUp .8s .05s both;\">Нарешті тіло, що вміє зцілятися саме<\u002Fh1>\n    <p style=\"margin: 0; font-size: clamp(16px, 2.2vw, 19px); line-height: 1.6; color: #4a5449; max-width: 560px; animation: haleUp .8s .14s both;\">Персональний супровід лікаря-натуропата: за силою трав, харчування та способу життя повертаю тіло до природного балансу.<\u002Fp>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; animation: haleUp .8s .2s both;\">\n      <a href=\"#apply\" style=\"background: #253026; color: #F7F4ED; font-size: 14.5px; padding: 16px 32px; border-radius: 999px; transition: transform .2s;\" style-hover=\"transform:translateY(-3px) scale(1.03)\">Записатись на консультацію<\u002Fa>\n      <a href=\"#offer\" style=\"font-size: 13px; color: #8a9080; transition: color .2s;\" style-hover=\"color:#253026\">переглянути всі послуги та продукти<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"width: 100%; max-width: 1000px; aspect-ratio: 21/9; border-radius: 20px; margin-top: 26px; background: #e7e2d3; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.05) 0 16px, transparent 16px 32px); display: flex; align-items: flex-end; justify-content: center; padding: 24px; animation: haleFade 1s .25s both, haleZoom 16s ease-in-out 1.2s infinite;\"><span style=\"font-family:'Eastman',monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #25302688;\">широке фото · природа / портрет<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== TRANSFORMATION ===== -->\n  <section id=\"journey\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(32px, 5vw, 56px) clamp(20px, 5vw, 56px) clamp(48px, 7vw, 72px);\">\n    <div style=\"text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: clamp(32px, 5vw, 48px);\">\n      <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #8E9B84;\">Шлях трансформації<\u002Fdiv>\n      <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(28px, 4.4vw, 40px); line-height: 1.15; margin: 0; max-width: 720px;\">«Допомагаю тілу згадати, як зцілюватися самому — за допомогою науки і рослин.»<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: clamp(16px, 2.5vw, 26px); align-items: stretch;\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div data-colorize=\"grayscale(.8) brightness(.97)\" style=\"position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: #d9d6cd; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.05) 0 14px, transparent 14px 28px); --cz: grayscale(.8) brightness(.97); display: flex; align-items: flex-end; padding: 18px;\">\n          <span style=\"position: absolute; top: 16px; left: 16px; background: #7a7268; color: #fff; font-size: 11px; padding: 5px 11px; border-radius: 999px;\">До<\u002Fspan>\n          <span style=\"font-family:'Eastman',monospace; font-size: 11px; color: #25302699;\">фото · втома / тьмяний стан<\u002Fspan>\n        <\u002Fdiv>\n        <div><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0 0 8px;\">Постійна втома<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Хронічні симптоми, збої циклу, тривога — тіло сигналить, що щось не так.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div data-colorize=\"grayscale(.12)\" style=\"position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: #dfe3d3; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.06) 0 14px, transparent 14px 28px); --cz: grayscale(.12); display: flex; align-items: flex-end; padding: 18px;\">\n          <span style=\"position: absolute; top: 16px; left: 16px; background: #8E9B84; color: #fff; font-size: 11px; padding: 5px 11px; border-radius: 999px;\">Процес<\u002Fspan>\n          <span style=\"font-family:'Eastman',monospace; font-size: 11px; color: #25302699;\">фото · трави, збір, чай<\u002Fspan>\n        <\u002Fdiv>\n        <div><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0 0 8px;\">Сила трав і супровід<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Індивідуальний збір трав, харчування та режим — мʼяко відновлюємо роботу тіла.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div data-colorize=\"none\" style=\"position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: #dce3cf; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.05) 0 14px, transparent 14px 28px); --cz: none; display: flex; align-items: flex-end; padding: 18px; box-shadow: 0 24px 44px -30px rgba(192,118,78,.5);\">\n          <span style=\"position: absolute; top: 16px; left: 16px; background: #C0764E; color: #fff; font-size: 11px; padding: 5px 11px; border-radius: 999px;\">Після<\u002Fspan>\n          <span style=\"font-family:'Eastman',monospace; font-size: 11px; color: #25302699;\">фото · енергія / світлий стан<\u002Fspan>\n        <\u002Fdiv>\n        <div><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0 0 8px;\">Природний баланс<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Стабільна енергія, чиста шкіра, регулярний цикл — і бажана вагітність, коли тіло готове.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== ABOUT YULIA ===== -->\n  <section id=\"about-yulia\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(20px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 56px); align-items: center;\">\n    <div style=\"flex: 1 1 300px; max-width: 420px; aspect-ratio: 4/5; border-radius: 20px; background: #e7e2d3; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.05) 0 16px, transparent 16px 32px); display: flex; align-items: flex-end; padding: 22px;\"><span style=\"font-family:'Eastman',monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #25302688;\">портрет · юлія<\u002Fspan><\u002Fdiv>\n    <div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 20px;\">\n      <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #8E9B84;\">Про Юлію<\u002Fdiv>\n      <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 42px); line-height: 1.08; margin: 0;\">Медична освіта, що зустрічає силу рослин<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #4a5449;\">Я — Юлія Кравченко, лікар-натуропат і травниця. Поєдную класичне медичне мислення з фітотерапією, щоб працювати з причиною стану, а не маскувати симптоми.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 20px; margin-top: 4px;\">\n        <div><div style=\"font-family: 'Calvino', serif; font-size: 34px; color: #C0764E;\"><span data-count=\"10\" data-suffix=\"+\">0+<\u002Fspan><\u002Fdiv><div style=\"font-size: 13px; color: #5a6459;\">років практики<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'Calvino', serif; font-size: 34px; color: #C0764E;\"><span data-count=\"500\" data-suffix=\"+\">0+<\u002Fspan><\u002Fdiv><div style=\"font-size: 13px; color: #5a6459;\">клієнток пройшли шлях<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'Calvino', serif; font-size: 34px; color: #C0764E;\">Мед.<\u002Fdiv><div style=\"font-size: 13px; color: #5a6459;\">освіта та кваліфікація<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== REQUESTS (pick by health state) ===== -->\n  <section id=\"requests\" data-reveal=\"\" style=\"background: #ece7d9; margin: clamp(24px, 4vw, 40px) 0;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: clamp(48px, 7vw, 80px) clamp(20px, 5vw, 56px);\">\n      <div style=\"text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: clamp(28px, 4vw, 40px);\">\n        <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #8E9B84;\">Оберіть свій стан<\u002Fdiv>\n        <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(30px, 5vw, 44px); margin: 0; max-width: 720px;\">З якими запитами приходять до Юлії<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; color: #5a6459; max-width: 520px;\">Натисніть на свій запит — покажу історію клієнтки та підкажу, як почати.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;\">\n        <sc-for list=\"{{ conds }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button data-stagger=\"\" data-rise=\"\" sc-camel-on-click=\"{{ c.select }}\" style=\"{{ c.style }}\" style-hover=\"transform:translateY(-3px)\"><span style=\"{{ c.markerStyle }}\"><\u002Fspan><span style=\"font-family: 'Calvino', serif; font-size: clamp(15px, 1.6vw, 18px); color: #253026;\">{{ c.name }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div id=\"cond-panel\" style=\"margin-top: 26px; background: #fff; border: 1px solid #25302618; border-radius: 20px; padding: clamp(28px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 44px); align-items: center;\">\n        <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"font-family: 'Eastman', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #C0764E;\">Історія клієнтки · {{ sel.name }}<\u002Fdiv>\n          <p style=\"font-family: 'Calvino', serif; font-style: italic; font-size: clamp(20px, 2.8vw, 26px); line-height: 1.35; margin: 0; color: #2a3423;\">{{ sel.review }}<\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 12px;\"><div style=\"width: 42px; height: 42px; border-radius: 999px; background: #ece7d9; flex-shrink: 0;\"><\u002Fdiv><div style=\"font-size: 14px; color: #4a5449;\">{{ sel.author }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 240px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n          <a href=\"#apply\" style=\"background: #C0764E; color: #fff; font-size: 14.5px; padding: 15px 28px; border-radius: 999px; transition: transform .2s;\" style-hover=\"transform:translateY(-2px)\">Залишити заявку<\u002Fa>\n          <a href=\"#offer\" style=\"color: #253026; font-size: 14px; padding: 6px 0; border-bottom: 1.5px solid #253026; transition: opacity .2s;\" style-hover=\"opacity:.55\">Обрати формат роботи →<\u002Fa>\n          <span style=\"font-size: 12px; color: #8a9080; max-width: 240px;\">Безкоштовна ознайомча розмова — ні до чого не зобовʼязує.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== HOW WE WORK ===== -->\n  <section id=\"how\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(24px, 4vw, 40px) clamp(20px, 5vw, 56px) clamp(40px, 6vw, 64px);\">\n    <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(32px, 5vw, 42px); margin: 0 0 32px;\">Як ми працюємо<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;\">\n      <div data-stagger=\"\" style=\"display: flex; flex-direction: column; gap: 12px;\"><div style=\"font-family: 'Calvino', serif; font-size: 40px; color: #C0764E;\">01<\u002Fdiv><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0;\">Заявка<\u002Fh3><div style=\"font-family: 'Eastman', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #C0764E;\">ваш крок<\u002Fdiv><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Ви залишаєте контакт і коротко описуєте свій запит.<\u002Fp><\u002Fdiv>\n      <div data-stagger=\"\" style=\"display: flex; flex-direction: column; gap: 12px;\"><div style=\"font-family: 'Calvino', serif; font-size: 40px; color: #8E9B84;\">02<\u002Fdiv><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0;\">Аналіз<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Анкета, обстеження та, за потреби, список аналізів.<\u002Fp><\u002Fdiv>\n      <div data-stagger=\"\" style=\"display: flex; flex-direction: column; gap: 12px;\"><div style=\"font-family: 'Calvino', serif; font-size: 40px; color: #8E9B84;\">03<\u002Fdiv><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0;\">План<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Письмовий план оздоровлення та відео-дзвінок з поясненням.<\u002Fp><\u002Fdiv>\n      <div data-stagger=\"\" style=\"display: flex; flex-direction: column; gap: 12px;\"><div style=\"font-family: 'Calvino', serif; font-size: 40px; color: #8E9B84;\">04<\u002Fdiv><h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: 21px; margin: 0;\">Супровід<\u002Fh3><p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #5a6459;\">Відповіді та корекція на шляху відновлення.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== REVIEWS ===== -->\n  <section id=\"reviews\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(40px, 6vw, 64px) clamp(20px, 5vw, 56px);\">\n    <h2 style=\"font-family: 'Calvin th: 440px;\">Для тих, хто хоче не лише відновити здоровʼя, а й опанувати підхід професійно. Окрема платформа з програмами та безкоштовними лекціями.<\u002Fp>\n          <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"align-self: flex-start; margin-top: 6px; font-size: 14px; color: #E8B784; border-bottom: 1.5px solid #E8B78455; padding-bottom: 3px; transition: color .2s;\" style-hover=\"color:#F7F4ED\">Перейти на сайт Академії ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 240px; display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #ffffff1f; padding-bottom: 12px;\"><span style=\"color: #E8B784;\">—<\u002Fspan><span style=\"font-size: 14px; color: #eef1e8;\">Для початківців і практиків<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #ffffff1f; padding-bottom: 12px;\"><span style=\"color: #E8B784;\">—<\u002Fspan><span style=\"font-size: 14px; color: #eef1e8;\">Модулі, практика й підтримка<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\"><span style=\"color: #E8B784;\">—<\u002Fspan><span style=\"font-size: 14px; color: #eef1e8;\">Безкоштовні лекції для знайомства<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- ===== LEAD MAGNET ===== -->\n  <section id=\"free\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(24px, 4vw, 40px) clamp(20px, 5vw, 56px) clamp(40px, 6vw, 64px);\">\n    <div style=\"border: 1px solid #25302618; border-radius: 22px; padding: clamp(28px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 44px); align-items: center; background: #fff;\">\n      <div style=\"flex: 0 0 auto; width: clamp(120px, 20vw, 170px); aspect-ratio: 3/4; border-radius: 12px; background: #e7e2d3; background-image: repeating-linear-gradient(135deg, rgba(37,48,38,.05) 0 12px, transparent 12px 24px); display: flex; align-items: flex-end; padding: 14px;\"><span style=\"font-family:'Eastman',monospace; font-size: 11px; color: #25302688;\">обкладинка<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #C0764E;\">Безкоштовно на пошту<\u002Fdiv>\n        <h3 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 0; line-height: 1.1;\">Чек-лист підготовки до вагітності<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #5a6459;\">Перший крок до тіла, готового до нового життя.<\u002Fp>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap; max-width: 480px;\">\n          <input placeholder=\"Ваш email\" style=\"flex: 1 1 200px; background: #F7F4ED; border: 1px solid #25302618; border-radius: 999px; padding: 14px 20px; font-size: 14px; color: #253026;\">\n          <a href=\"#\" style=\"background: #253026; color: #F7F4ED; font-size: 14px; padding: 14px 26px; border-radius: 999px; white-space: nowrap; transition: transform .2s;\" style-hover=\"transform:translateY(-2px)\">Отримати<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== APPLICATION FORM ===== -->\n  <section id=\"apply\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(40px, 6vw, 64px) clamp(20px, 5vw, 56px);\">\n    <div style=\"background: #253026; border-radius: 24px; padding: clamp(32px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: clamp(28px, 4vw, 56px); color: #F7F4ED;\">\n      <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px;\">\n        <div style=\"font-family: 'Eastman', monospace; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #b5c2a3;\">Заявка<\u002Fdiv>\n        <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 42px); line-height: 1.08; margin: 0;\">Залиште контакт — Юлія звʼяжеться з вами<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #d0d8c8; max-width: 420px;\">Коротко опишіть свій запит, і ми підберемо формат співпраці, що підійде саме вам.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; color: #d0d8c8; margin-top: 2px;\">\n          <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><span style=\"color: #E8B784;\">—<\u002Fspan> <strong style=\"color: #E8B784; font-weight: 400;\">Безкоштовна ознайомча розмова<\u002Fstrong> — ні до чого не зобовʼязує<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><span style=\"color: #E8B784;\">—<\u002Fspan> Онлайн, зручний час, українською<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><span style=\"color: #E8B784;\">—<\u002Fspan> Конфіденційно — дані про здоровʼя лишаються між нами<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 16px; font-size: 13px; margin-top: 6px; color: #b5c2a3;\"><a href=\"#\" style-hover=\"color:#F7F4ED\">Instagram<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">Telegram<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">YouTube<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">Email<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <form style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px;\" sc-camel-on-submit=\"{{ noop }}\">\n        <input placeholder=\"Ваше імʼя\" style=\"background: #F7F4ED; border: 1px solid transparent; border-radius: 12px; padding: 15px 18px; font-size: 14px; color: #253026; transition: border-color .2s, box-shadow .2s;\" style-focus=\"border-color:#8E9B84;box-shadow:0 0 0 3px rgba(142,155,132,.2)\">\n        <input placeholder=\"Telegram або email\" style=\"background: #F7F4ED; border: 1px solid transparent; border-radius: 12px; padding: 15px 18px; font-size: 14px; color: #253026; transition: border-color .2s, box-shadow .2s;\" style-focus=\"border-color:#8E9B84;box-shadow:0 0 0 3px rgba(142,155,132,.2)\">\n        <textarea placeholder=\"Ваш запит (коротко)\" rows=\"4\" style=\"background: #F7F4ED; border: 1px solid transparent; border-radius: 12px; padding: 15px 18px; font-size: 14px; color: #253026; resize: vertical; transition: border-color .2s, box-shadow .2s;\" style-focus=\"border-color:#8E9B84;box-shadow:0 0 0 3px rgba(142,155,132,.2)\"><\u002Ftextarea>\n        <a href=\"#\" style=\"text-align: center; background: #C0764E; color: #fff; font-size: 15px; padding: 16px; border-radius: 12px; transition: transform .2s;\" style-hover=\"transform:translateY(-2px)\">Надіслати заявку<\u002Fa>\n        <span style=\"font-size: 12px; color: #8fa082; text-align: center;\">Відповім особисто протягом 24 годин.<\u002Fspan>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== CTA ===== -->\n  <section id=\"cta\" data-reveal=\"\" style=\"max-width: 1120px; margin: 0 auto; padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 56px) clamp(56px, 8vw, 88px); text-align: center;\">\n    <div style=\"border-top: 1px solid #25302622; padding-top: clamp(48px, 7vw, 72px); display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n      <h2 style=\"font-family: 'Calvino', serif; font-weight: 400; font-size: clamp(38px, 6vw, 54px); margin: 0; line-height: 1.03; max-width: 660px;\">Готові почати шлях до себе?<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; max-width: 460px; color: #4a5449;\">Зробіть перший крок природного відновлення разом із Юлією.<\u002Fp>\n      <a href=\"#apply\" style=\"background: #C0764E; color: #fff; font-size: 15px; padding: 16px 34px; border-radius: 999px; transition: transform .2s; animation: haleCta 3.4s ease-in-out infinite;\" style-hover=\"transform:translateY(-3px) scale(1.03)\">Записатись на консультацію<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"background: #253026; color: #b5c0ac;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: clamp(40px, 6vw, 56px) clamp(20px, 5vw, 56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\"><div style=\"font-family: 'Calvino', serif; font-size: 26px; color: #F7F4ED;\">Hale<\u002Fdiv><p style=\"margin: 0; font-size: 14px; line-height: 1.6; max-width: 280px;\">Природне відновлення здоровʼя через науку і рослини.<\u002Fp><div style=\"display: flex; gap: 16px; font-size: 13px; margin-top: 6px;\"><a href=\"#\" style-hover=\"color:#F7F4ED\">Instagram<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">Telegram<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">YouTube<\u002Fa><a href=\"#\" style-hover=\"color:#F7F4ED\">Email<\u002Fa><\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\"><div style=\"color: #F7F4ED; margin-bottom: 4px;\">Розділи<\u002Fdiv><a href=\"#about-yulia\" style-hover=\"color:#F7F4ED\">Про Юлію<\u002Fa><a href=\"#offer\" style-hover=\"color:#F7F4ED\">Пропозиції<\u002Fa><a href=\"#reviews\" style-hover=\"color:#F7F4ED\">Відгуки<\u002Fa><a href=\"#apply\" style-hover=\"color:#F7F4ED\">Записатись<\u002Fa><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\"><div style=\"color: #F7F4ED; font-size: 14px;\">Підписка на розсилку<\u002Fdiv><div style=\"display: flex; gap: 8px;\"><input placeholder=\"Email\" style=\"flex:1; background: #33402f; border: none; border-radius: 999px; padding: 11px 16px; color: #F7F4ED; font-size: 13px;\"><a href=\"#\" style=\"background:#C0764E; color:#fff; padding: 11px 16px; border-radius: 999px; font-size: 13px;\">→<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, mobile: false, openFaq: null, tab: 'consult', cond: 'hormones' };\n  conditions = [\n    { k: 'hormones', name: 'Гормональний баланс і ПМС', marker: '#C0764E', review: '«Цикл вирівнявся, а ПМС майже зник — і все це без гормональних препаратів.»', author: 'Олена, 34' },\n    { k: 'fatigue', name: 'Хронічна втома та брак енергії', marker: '#8E9B84', review: '«Уперше за роки прокидаюся з енергією, а не з бажанням знову лягти.»', author: 'Марія, 29' },\n    { k: 'gut', name: 'Травлення, ШКТ, здуття', marker: '#C0764E', review: '«Здуття і важкість після їжі зникли, а харчування нарешті стало зрозумілим.»', author: 'Ірина, 41' },\n    { k: 'skin', name: 'Шкіра, акне, висипання', marker: '#8E9B84', review: '«Шкіра очистилась, коли ми попрацювали з причиною зсередини, а не з кремами.»', author: 'Наталя, 26' },\n    { k: 'pregnancy', name: 'Підготовка до вагітності', marker: '#C0764E', review: '«Довгоочікувана вагітність настала природно, коли тіло було готове.»', author: 'Ірина Д., 33' },\n    { k: 'antibiotics', name: 'Відновлення після антибіотиків', marker: '#8E9B84', review: '«Відновила сили та імунітет після важкого курсу лікування.»', author: 'Софія, 38' },\n  ];\n  faqData = [\n    { q: 'Натуропатія — це замість лікаря?', a: 'Ні. Я поєдную медичне мислення з природними методами й працюю в межах своєї компетенції; за потреби скеровую до профільних спеціалістів.' },\n    { q: 'Як проходить консультація?', a: 'Ви заповнюєте анкету, я аналізую її та попередні обстеження, складаю письмовий план — і ми детально обговорюємо його на відео-дзвінку.' },\n    { q: 'Чи потрібно здавати аналізи?', a: 'За потреби я надам список рекомендованих обстежень — це допомагає працювати з причиною стану, а не з симптомами.' },\n    { q: 'Скільки триває результат?', a: 'Рекомендації розписані на 4–6 тижнів. Для глибших станів підходить формат «Ведення» із супроводом протягом місяця й наперед.' },\n    { q: 'Ви працюєте онлайн?', a: 'Так, усі консультації проходять онлайн — незалежно від того, де ви перебуваєте.' },\n  ];\n  componentDidMount() {\n    this.mq = window.matchMedia('(max-width: 820px)');\n    this.onMq = () => this.setState({ mobile: this.mq.matches, menuOpen: false });\n    this.onMq();\n    this.mq.addEventListener('change', this.onMq);\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.classList.add('is-shown');\n          e.target.querySelectorAll('[data-colorize]').forEach((el, i) => {\n            setTimeout(() => el.classList.add('is-shown'), 250 + i * 400);\n          });\n          e.target.querySelectorAll('[data-count]').forEach(el => this.animateCount(el));\n          e.target.querySelectorAll('[data-stagger]').forEach((el, i) => {\n            setTimeout(() => el.classList.add('is-shown'), 120 + i * 90);\n          });\n          this.io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    requestAnimationFrame(() => {\n      document.querySelectorAll('[data-reveal]').forEach(el => this.io.observe(el));\n    });\n    this.onScroll = () => {\n      const h = document.querySelector('header');\n      if (!h) return;\n      const inner = h.firstElementChild;\n      const compact = window.scrollY > 16;\n      h.style.boxShadow = compact ? '0 12px 34px -22px rgba(37,48,38,.55)' : 'none';\n      h.style.background = compact ? 'rgba(247,244,237,.95)' : 'rgba(247,244,237,.82)';\n      if (inner) { inner.style.paddingTop = compact ? '10px' : '18px'; inner.style.paddingBottom = compact ? '10px' : '18px'; }\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n  animateCount(el) {\n    if (el.dataset.done) return;\n    el.dataset.done = '1';\n    const target = parseFloat(el.getAttribute('data-count')) || 0;\n    const suffix = el.getAttribute('data-suffix') || '';\n    const dur = 1300, start = performance.now();\n    const step = (now) => {\n      const p = Math.min(1, (now - start) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = Math.round(target * eased) + suffix;\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n  tabStyle(active) {\n    return {\n      padding: '11px 22px', borderRadius: '999px', border: '1px solid ' + (active ? '#253026' : '#25302622'),\n      cursor: 'pointer', fontFamily: \"'Eastman', sans-serif\", fontSize: '14px', transition: 'all .2s',\n      background: active ? '#253026' : 'transparent', color: active ? '#F7F4ED' : '#4a5449',\n    };\n  }\n  chipStyle(active) {\n    return {\n      cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '12px', width: '100%',\n      background: '#fff', borderRadius: '14px', padding: '14px 18px', textAlign: 'left',\n      fontFamily: \"'Eastman', sans-serif\", transition: 'transform .25s, box-shadow .25s, border-color .25s',\n      border: '1px solid ' + (active ? '#C0764E' : '#25302614'),\n      boxShadow: active ? '0 16px 36px -26px rgba(192,118,78,.5)' : 'none',\n      transform: active ? 'translateY(-2px)' : 'none',\n    };\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState && prevState.cond !== this.state.cond) {\n      const p = document.getElementById('cond-panel');\n      if (p) { p.style.animation = 'none'; void p.offsetWidth; p.style.animation = 'haleTab .4s ease both'; }\n    }\n  }\n  componentWillUnmount() {\n    if (this.mq) this.mq.removeEventListener('change', this.onMq);\n    if (this.io) this.io.disconnect();\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n  }\n  renderVals() {\n    const t = this.state.tab;\n    return {\n      mobile: this.state.mobile,\n      desktop: !this.state.mobile,\n      menuOpen: this.state.menuOp
